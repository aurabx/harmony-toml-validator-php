[schema]
version = "1.10.0"

[proxy]
id = "gateway-http3"
pipelines_path = "pipelines"
transforms_path = "transforms"

[network.default]
enable_wireguard = false

[[network.default.tcp_config]]
bind_address = "0.0.0.0"
bind_port = 8080
cert_path = "/etc/certs/tls.crt"
key_path = "/etc/certs/tls.key"
force_https = false

[network.default.http3]
bind_address = "0.0.0.0"
bind_port = 443
cert_path = "/etc/certs/quic.crt"
key_path = "/etc/certs/quic.key"

[logging]
log_level = "info"
log_to_file = false

[storage]
backend = "filesystem"

[storage.options]
path = "./tmp"
